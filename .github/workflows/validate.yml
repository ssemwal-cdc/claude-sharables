name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, so check_version_bump.py finds origin/main and a merge-base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # Enforces the layout, manifest and doc rules described in CLAUDE.md, plus the
      # cross-plugin shared-block, cdnjs-pin, template-version and verdict-reachability
      # checks in scripts/shared_blocks.py.
      - name: Validate marketplace, plugins and docs
        run: python3 scripts/validate.py

      - name: Test the plugin.json tail and README row rules
        run: python3 scripts/test_validate_versions.py

      - name: Test the record checks
        run: python3 scripts/test_check_records.py

      - name: Test the version-bump check
        run: python3 scripts/test_check_version_bump.py

      # Pinned to the version proven locally (3.1.5); needed by the skill's own
      # workbook reader test below.
      - name: Install openpyxl
        run: pip install openpyxl==3.1.5

      # Runs the executable code the skills carry, extracted from SKILL.md itself. Was a
      # manual gate until 2026-08-24 while README.md told contributors it ran here, so the
      # three-state fan-out, sniff-table, CCO-demotion and renderBar assertions were habit.
      - name: Run the skills' own code tests
        run: python3 scripts/test_skill_code.py

  # D81, device usability check, asks for every screen at three widths, in both
  # themes. That ran by hand only until now. This job runs the same capture command
  # in a real Chromium and gates on it, so a horizontal overflow fails CI instead of
  # waiting for someone to run scripts/measure_float.js --shots by hand.
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # Pinned to the Playwright version already proved against this repo (F99,
      # device shots first run), not "latest" — D51, check pins, never share, for
      # the same reason this repo pins cdnjs libraries.
      - name: Install Playwright 1.56.1 and its Chromium
        timeout-minutes: 3
        run: |
          npm install -g playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Capture every screen at 390px, 1200px and 1600px, light and dark
        run: NODE_PATH=$(npm root -g) node scripts/measure_float.js --shots .claude/shots

      # check_device_shots() in scripts/check_records.py fails the build on any
      # capture with a horizontal overflow, or on fewer than 18 captures.
      - name: Validate, including the captured shots
        run: python3 scripts/validate.py

      - name: Upload the captures for a maintainer to look at
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-shots
          path: .claude/shots/
          retention-days: 7

  # The record claim runs through the stamp (`merge <pr>`). This job refuses a number
  # a branch adds without a Record-claim trailer, and any pending record on main.
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivinate7/claude-settings/actions/stamp@9228e614a1261f745c7f4ff0e6a73d7d4d70cec8
        with:
          mode: check
          config: .github/stamp.json
