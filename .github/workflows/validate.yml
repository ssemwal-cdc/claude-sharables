name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Enforces the layout, manifest and doc rules described in CLAUDE.md.
      - name: Validate marketplace, plugins and docs
        run: python3 scripts/validate.py
