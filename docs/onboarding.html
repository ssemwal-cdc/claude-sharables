<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approval Plugin Setup</title>
<style>
:root{ --bg:#F5F8F8; --ink:#16201F; --muted:#5B6A68; --line:#D9E3E1; --accent:#0F6E6E; }
/* GitHub Pages serves this file raw and nothing sets data-theme, so the theme is
   whatever the reader's OS says. No [data-theme] blocks here on purpose. See CLAUDE.md. */
@media (prefers-color-scheme:dark){
  :root{ --bg:#0E1414; --ink:#E3EAE9; --muted:#93A2A0; --line:#26312F; --accent:#54BFB2; }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.55;
}
.wrap{max-width:620px; margin:0 auto; padding:48px 22px 80px; display:flex; flex-direction:column; gap:20px}
h1{margin:0; font-size:clamp(26px,5vw,36px); line-height:1.1; letter-spacing:-.02em; font-weight:700}
p{margin:0; max-width:60ch}
.muted{color:var(--muted)}
a{color:var(--accent)}
footer{color:var(--muted); font-size:13.5px; border-top:1px solid var(--line); padding-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Approval Plugin Setup</h1>
  <p>Setup runs inside the skill, on its first run. Install the plugin, then ask for a review. The skill asks for anything else it needs.</p>
  <p><a href="https://github.com/ssemwal-cdc/claude-sharables#readme">Install steps are in the repo README.</a></p>
  <footer>Plugins from <code>ssemwal-cdc/claude-sharables</code>.</footer>
</div>
</body>
</html>
